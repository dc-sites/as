<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Hub | Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-form { max-width: 600px; margin: 2rem auto; background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.8rem; background: var(--bg-primary); border: 1px solid var(--border);
      color: var(--text-primary); border-radius: 6px; font-family: inherit;
    }
    .submit-btn { width: 100%; padding: 1rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-lock"></i> ASIAN HUB ADMIN</div>
    <a href="index.html" style="color: var(--text-primary); text-decoration: none;"><i class="fas fa-external-link-alt"></i> View Site</a>
  </header>

  <main class="container">
    <form class="admin-form" id="videoForm">
      <h2 style="margin-bottom: 1.5rem;">Add New Video</h2>
      
      <div class="form-group">
        <label>Video Title</label>
        <input type="text" id="title" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label>Collection (Category)</label>
        <input type="text" id="collection" list="collectionList" placeholder="e.g., Action, Drama, New Releases" required>
        <datalist id="collectionList">
          <option value="Featured">
          <option value="Trending">
        </datalist>
      </div>

      <div class="form-group">
        <label>Cloudflare R2 Video URL</label>
        <input type="url" id="videoUrl" placeholder="https://pub-xxx.r2.dev/video.mp4" required>
      </div>

      <div class="form-group">
        <label>Thumbnail Image URL</label>
        <input type="url" id="thumbnail" placeholder="https://pub-xxx.r2.dev/thumb.jpg" required>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="published" checked> Publish Immediately
        </label>
      </div>

      <button type="submit" class="submit-btn">Save to Firebase</button>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
